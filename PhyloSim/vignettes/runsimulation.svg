<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a202c">
  <!-- Overview of the functions to run simulations (vignette PhyloSimManual, chapter "Running the model").
       Functions: rounded boxes (class fun), objects: ellipses (class obj). Edit as text. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <style>
      .fun { fill: #e8f1fb; stroke: #2b6cb0; stroke-width: 1.2; }
      .obj { fill: #fdf3d0; stroke: #b7791f; stroke-width: 1.2; }
      .code { font-family: Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
      .note { fill: #4a5568; font-size: 11.5px; }
      .edge { stroke: #4a5568; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- parameters -->
  <rect class="fun" x="20" y="40" width="200" height="40" rx="18"/>
  <text class="code" x="120" y="65" text-anchor="middle">createCompletePar()</text>
  <path class="edge" d="M120,80 V118"/>
  <ellipse class="obj" cx="120" cy="150" rx="90" ry="30"/>
  <text x="120" y="147" text-anchor="middle">parameters</text>
  <text class="note" x="120" y="163" text-anchor="middle">(list)</text>

  <!-- simulation -->
  <path class="edge" d="M195,134 L298,64"/>
  <text class="note" x="232" y="88" text-anchor="middle">one set</text>
  <path class="edge" d="M195,166 L298,236"/>
  <text class="note" x="236" y="224" text-anchor="middle">list of sets</text>
  <rect class="fun" x="300" y="40" width="190" height="40" rx="18"/>
  <text class="code" x="395" y="65" text-anchor="middle">runSimulation()</text>
  <rect class="fun" x="300" y="220" width="190" height="40" rx="18"/>
  <text class="code" x="395" y="245" text-anchor="middle">runSimulationBatch()</text>

  <!-- results -->
  <path class="edge" d="M490,60 H513"/>
  <ellipse class="obj" cx="600" cy="60" rx="85" ry="28"/>
  <text x="600" y="57" text-anchor="middle">PhyloSim</text>
  <text class="note" x="600" y="73" text-anchor="middle">(one simulation)</text>
  <path class="edge" d="M490,240 H513"/>
  <ellipse class="obj" cx="600" cy="240" rx="85" ry="28"/>
  <text x="600" y="237" text-anchor="middle">PhylosimList</text>
  <text class="note" x="600" y="253" text-anchor="middle">(several simulations)</text>
  <path class="edge" d="M600,88 V130"/>
  <rect class="fun" x="510" y="132" width="180" height="36" rx="16"/>
  <text class="code" x="600" y="155" text-anchor="middle">createPhylosimList()</text>
  <path class="edge" d="M600,168 V210"/>
  <path class="edge" d="M685,240 C720,240 720,60 687,60"/>
  <text class="code" x="718" y="154">[[i]]</text>

  <!-- legend -->
  <rect class="fun" x="20" y="296" width="70" height="22" rx="10"/>
  <text class="note" x="98" y="311">function</text>
  <ellipse class="obj" cx="190" cy="307" rx="35" ry="11"/>
  <text class="note" x="232" y="311">object</text>
  <path class="edge" d="M300,307 H340"/>
  <text class="note" x="348" y="311">input or output</text>
</svg>
